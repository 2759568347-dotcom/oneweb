<style>

  .const-row b{font-family:var(--math);font-weight:500;font-size:13.5px;color:#d3e7f2;letter-spacing:.02em}
  .const-foot{margin:10px 0 0;font-size:11.5px;line-height:1.6;color:#a2b9c7;font-family:var(--math)}

  .block{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:14px}
  .block h3{margin:0 0 10px;font-size:12px;letter-spacing:.1em;color:var(--muted);font-weight:650}

  .ex{

    background:#e6f1f7;color:#3f6880;display:grid;place-items:center;

  }
  .ex code{font-family:var(--math);font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

  .rules{list-style:none;margin:0;padding:0;font-size:12px;color:#415560;line-height:1.5}
  .rules li{display:flex;gap:8px;align-items:flex-start;padding:4.5px 0}
  .dot{width:7px;height:7px;border-radius:50%;flex:0 0 7px;margin-top:6px}
  .d1{background:var(--green)} .d2{background:#3f7c93} .d3{background:#bd8f45} .d4{background:var(--red)}
  .rules b{font-family:var(--math);font-weight:600;color:var(--ink)}

  /* ---------- 主区 ---------- */

    display:flex;flex-direction:column;min-width:0;
    background:var(--card);border:1px solid var(--line);border-radius:20px;
    box-shadow:0 16px 40px rgba(60,50,25,.07);overflow:hidden;
  }
  .chat-head{
    display:flex;align-items:center;justify-content:space-between;gap:10px;
    padding:13px 18px;border-bottom:1px solid var(--line);
    background:linear-gradient(180deg,#ffffff,#fbfdfe);
  }
  .chat-head .who{display:flex;align-items:center;gap:9px;font-size:13.5px;font-weight:600}
  .live{width:7px;height:7px;border-radius:50%;background:var(--green);box-shadow:0 0 0 3px var(--green-soft)}
  .chat-head .tag{font-size:11.5px;color:var(--muted);border:1px solid var(--line);border-radius:999px;padding:3px 9px}
  .clear{
    background:none;border:1px solid var(--line);color:var(--muted);border-radius:999px;
    font-family:inherit;font-size:11.5px;padding:4px 10px;cursor:pointer;
  }
  .clear:hover{color:var(--ink);border-color:#c8dae5}

  .log{flex:1;overflow-y:auto;padding:20px 18px 8px;display:flex;flex-direction:column;gap:14px;scroll-behavior:smooth}
  .log::-webkit-scrollbar{width:8px}
  .log::-webkit-scrollbar-thumb{background:#d9e6ee;border-radius:8px}

  .msg{display:flex;gap:10px;max-width:100%}
  .msg.user{justify-content:flex-end}
  .avatar{
    width:30px;height:30px;flex:0 0 30px;border-radius:9px;display:grid;place-items:center;
    font-family:var(--math);font-style:italic;font-size:15px;
    background:linear-gradient(150deg,#5c93b3,#2c6b8f);color:#f7fbfe;
    box-shadow:0 3px 8px rgba(140,97,24,.22);margin-top:2px;
  }
  .bubble{
    background:linear-gradient(160deg,#1e3f4f,#152c38);color:#ecf4f9;
    padding:10px 14px;border-radius:14px 14px 4px 14px;
    font-size:15px;line-height:1.55;max-width:74%;word-break:break-word;
  }

  .card{
    flex:1;min-width:0;background:#ffffff;border:1px solid var(--line);

  .card-head .pill{font-size:11px;color:#3f6880;background:#eaf3f9;border-radius:999px;padding:2.5px 9px}

  .high{background:var(--green-soft);color:#17606f;border:1px solid #c3e0e6}
  .ok{background:var(--green-soft);color:#17606f;border:1px solid #c3e0e6}
  .near{background:var(--amber-soft);color:#82561c;border:1px solid #ecd9b6}
  .bad{background:var(--red-soft);color:#8c3227;border:1px solid #eecfc8}
  .neutral{background:#eef4f8;color:#4e6572;border:1px solid #d9e6ee}

  .note{margin:10px 0 0;font-size:12.5px;line-height:1.65;color:#4d6370}
  .note code{font-family:var(--math);font-size:13px;color:#243a44}

  .tips{margin:10px 0 0;padding:0;list-style:none;font-size:12.5px;line-height:1.6;color:#465b66}
  .tips li{position:relative;padding-left:16px;margin:5px 0}
  .tips li:before{content:"";position:absolute;left:2px;top:7px;width:5px;height:5px;border-radius:50%;background:var(--gold)}
  .assume{margin:8px 0 0;font-size:12px;color:#6f8492;font-style:normal}

  .bar-wrap{margin:2px 0 6px;padding:2px 0 0}
  .bar-wrap svg{width:100%;height:auto;display:block}

  .chips{display:flex;flex-wrap:wrap;gap:7px;margin-top:12px}
  .chip{
    background:#eef6fb;border:1px solid var(--line);border-radius:999px;
    padding:5px 11px;font-family:inherit;font-size:12px;line-height:1.4;color:#45606f;cursor:pointer;
    transition:background .15s,border-color .15s,color .15s;
  }
  .chip:hover{background:var(--gold-soft);border-color:#a9c9dd;color:#1f556e}

  .composer{padding:12px 16px 8px;border-top:1px solid var(--line);background:#ffffff}
  .field{display:flex;gap:9px;align-items:center}
  .field input{
    flex:1;min-width:0;border:1px solid var(--line);background:#f7fbfd;border-radius:12px;
    padding:12px 14px;font-family:var(--math);font-size:15px;color:var(--ink);outline:none;
    transition:border-color .15s,box-shadow .15s,background .15s;
  }
  .field input::placeholder{font-family:var(--font);font-size:13px;color:#93a7b4}
  .field input:focus{border-color:#7fa9c2;background:#fbfdff;box-shadow:0 0 0 3px rgba(120,168,196,.30)}
  .send{
    flex:0 0 auto;border:0;border-radius:12px;padding:12px 20px;cursor:pointer;
    background:linear-gradient(150deg,#224654,#17313d);color:#f0f7fa;
    font-family:inherit;font-size:13.5px;letter-spacing:.06em;font-weight:600;

  .foot{margin:8px 2px 0;font-size:11.5px;color:#8fa3b0;text-align:center;letter-spacing:.02em}

  .panel{gap:8px;padding-right:2px}
  .brand{gap:10px}
  .phi-mark{width:40px;height:40px;flex:0 0 40px;font-size:21px;border-radius:11px}
  .brand h1{font-size:21px}
  .brand p{font-size:12.5px;margin-top:3px}
  .const-card{padding:11px 13px}
  .const-card h2{font-size:11.5px;margin-bottom:6px}
  .const-row{padding:3px 0}
  .const-row span{font-size:13px}
  .const-row b{font-size:16.5px}
  .const-foot{font-size:12px;line-height:1.45;margin-top:4px}
  .block{padding:11px 12px}
  .block h3{font-size:12px;margin-bottom:7px}

  .assume{font-size:13.5px}

  .send{font-size:16px;padding:12px 22px}
  .foot{font-size:13px}

    body{background:#fff}
    .app{position:static;transform:none;width:100%;height:auto}
  }

<div class="app">

  <aside class="panel">
    <div class="brand">
      <div class="phi-mark">φ</div>
      <div>
        <h1>黄金分割验证助手</h1>
        <p>课堂验算员 · 只验算，不代推导</p>
      </div>
    </div>

    <section class="const-card">
      <h2>核 心 常 量</h2>
      <div class="const-row"><span>黄金比 φ</span><b>1.6180339887…</b></div>
      <div class="const-row"><span>黄金分割比 1/φ</span><b>0.6180339887…</b></div>
      <div class="const-row"><span>标准方程</span><b>x² − x − 1 = 0</b></div>
      <p class="const-foot">φ = (1+√5)/2，1/φ = (√5−1)/2<br/>满足 φ² = φ + 1</p>
    </section>

    <section class="block">
      <h3>试 一 试</h3>
      <div class="examples">
        <button class="ex" data-q="解方程 x²-x-1=0"><i>T01</i><code>x² − x − 1 = 0</code></button>
        <button class="ex" data-q="AP=6.18，AB=10"><i>T02</i><code>AP=6.18，AB=10</code></button>
        <button class="ex" data-q="AP=6.2，AB=10"><i>T03</i><code>AP=6.2，AB=10</code></button>
        <button class="ex" data-q="AP=5，AB=8"><i>T04</i><code>AP=5，AB=8</code></button>
        <button class="ex" data-q="AP=4，AB=10"><i>T05</i><code>AP=4，AB=10</code></button>
        <button class="ex" data-q="AB=16，AP=10"><i>T06</i><code>AB=16，AP=10</code></button>
      </div>
    </section>

    <section class="block">
      <h3>判 定 标 准</h3>
      <ul class="rules">
        <li><span class="dot d1"></span><span>偏差 <b>≤ 0.005</b>　符合黄金比</span></li>
        <li><span class="dot d2"></span><span>偏差 <b>≤ 0.02</b>　符合容差（接近）</span></li>
        <li><span class="dot d3"></span><span>偏差 <b>≤ 0.05</b>　基本接近</span></li>
        <li><span class="dot d4"></span><span>偏差 <b>&gt; 0.05</b>　触发纠错引导</span></li>
      </ul>
    </section>
  </aside>

  <main class="chat">
    <div class="chat-head">
      <div class="who"><span class="live"></span>验算员</div>
      <div style="display:flex;align-items:center;gap:8px">
        <span class="tag">离线确定性计算</span>
        <button class="clear" id="clear">清空</button>
      </div>
    </div>

    <div class="log" id="log" aria-live="polite"></div>

    <form class="composer" id="form" autocomplete="off">
      <div class="field">
        <input id="q" type="text" placeholder="输入方程或线段长度，例如：x²-x-1=0　/　AP=6.18，AB=10"/>
        <button class="send" type="submit">验算</button>
      </div>
      <p class="foot">手算推导是根本，这里只负责检验结果。</p>
    </form>
  </main>
</div>

      "a": "最早的系统定义出现在欧几里得《几何原本》（约公元前 300 年），当时叫「中外比」；文艺复兴时期帕乔利把它称作「神圣比例」。<br>符号 φ 通常认为是 20 世纪初 Mark Barr 用雕塑家菲狄亚斯（Pheidias）的首字母命名；「黄金分割」这个叫法则由 19 世纪德国数学家 Martin Ohm 普及。<br>别把它讲成「古希腊为美学而发明」——它的数学动机来自正五边形与比例理论。"
    },
    {
      "id": "external",
      "q": "一条线段有两个黄金分割点吗？",
      "kw": ["两个黄金分割点", "两个分割点", "外分", "延长线", "唯一吗", "几个分割点"],
      "a": "内分点把线段分成 0.618 : 0.382，就是课堂讲的那个点。<br>如果允许在延长线上取点，还有外分点：整体 : 较长段 = 1.618 : 1（较长段 = 1.618 × 原线段）。<br>尺规作图题通常只要求内分点。"
    }
  ];
  /* FAQ_END */

  function looksLikeQuestion(s) {
    return /[?？]|什么|为什么|怎么|如何|是不是|有没有|区别|关系|原理|意思|证明|讲讲|介绍|举例|用途|意义|吗|呢/.test(s);
  }

  function hasLabels(s) {
    return /(ap|ab|pb|较长段|长段|长边|较短段|短段|短边|全段|总长|全长|整段|总段)/i.test(s);
  }

  // 关键词打分命中，得分 = 命中关键词的字符数之和
  function faqMatch(text) {
    var s = normalize(text);
    var best = null, bestScore = 0;
    for (var i = 0; i < FAQ.length; i++) {
      var f = FAQ[i], score = 0;
      for (var j = 0; j < f.kw.length; j++) {
        if (s.indexOf(normalize(f.kw[j])) >= 0) score += f.kw[j].length;
      }
      if (score > bestScore) { bestScore = score; best = { entry: f, score: score, index: i }; }
    }
    return bestScore >= 2 ? best : null;
  }

  return {
    PHI: PHI,
    INV_PHI: INV_PHI,
    fmt: fmt,
    normalize: normalize,
    parsePoly: parsePoly,
    prettyEq: prettyEq,
    parseEquation: parseEquation,
    solveQuadratic: solveQuadratic,
    goldenForm: goldenForm,
    checkGoldenRatio: checkGoldenRatio,
    parseSegments: parseSegments,
    looksLikeEquation: looksLikeEquation,
    FAQ: FAQ,
    faqMatch: faqMatch,
    looksLikeQuestion: looksLikeQuestion,
    hasLabels: hasLabels
  };
});
/* ENGINE_INLINE_END */
</script>
<script>
(function () {
  'use strict';
  var E = window.GoldenEngine;
  var log = document.getElementById('log');
  var form = document.getElementById('form');
  var input = document.getElementById('q');

  if (!E) {
    log.innerHTML = '<div class="card" style="margin:20px">' +
      '<div class="card-head"><span class="label">加 载 失 败</span></div>' +
      '<p class="note" style="font-size:15px;margin-top:0">页面内的计算引擎没有跑起来，所以任何输入都没有回应。' +
      '本页是单文件，正常情况下不该出现这条提示 —— 请重新下载 <b>index.html</b> 后再打开；' +
      '若浏览器装了拦截脚本的插件，先暂停插件再试。</p></div>';
    return;
  }

  /* ---------- 固定 16:9：1280×720 设计稿按视口等比缩放 ---------- */
  var DESIGN_W = 1280, DESIGN_H = 720;
  function fitCanvas() {
    var vw = window.innerWidth || DESIGN_W;
    var vh = window.innerHeight || DESIGN_H;
    var s = Math.min(vw / DESIGN_W, vh / DESIGN_H);
    document.documentElement.style.setProperty('--s', (Math.round(s * 1e4) / 1e4).toFixed(4));
  }
  fitCanvas();
  window.addEventListener('resize', fitCanvas);
  window.addEventListener('orientationchange', fitCanvas);

  function esc(s) {
    return String(s).replace(/[&<>"']/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
    });
  }

  /* ---------- 渲染工具 ---------- */

  function agentShell(inner, label, pill) {
    return '<div class="msg"><div class="avatar">&phi;</div><div class="card">' +
      '<div class="card-head"><span class="label">' + (label || '验 算 结 果') + '</span>' +
      (pill ? '<span class="pill">' + pill + '</span>' : '') + '</div>' + inner + '</div></div>';
  }
  function userBubble(text) {
    return '<div class="msg user"><div class="bubble"><code>' + esc(text) + '</code></div></div>';
  }
  function push(html) {
    var wrap = document.createElement('div');
    wrap.innerHTML = html;
    log.appendChild(wrap.firstChild);
    log.scrollTop = log.scrollHeight;
  }

  function equationCard(raw) {
    var p = E.parseEquation(raw);
    if (!p.ok) {
      var msg = {
        'no-eq': '这看起来不像方程。请写成完整形式，例如 <b>x² - x - 1 = 0</b>（等号两边都要有）。',
        'no-x': '这个式子里没有未知数 x，无法求解。',
        'parse': '解析失败：' + (p.detail || '请检查书写格式。'),
        'identity': p.detail
      }[p.reason] || '请检查输入。';
      return agentShell('<p class="note" style="font-size:15px">' + msg + '</p>', '无 法 求 解', '格式');
    }

    var s = E.solveQuadratic(p.a, p.b, p.c);
    var g = E.goldenForm(p.a, p.b, p.c);
    var html = '<div class="eq-title">' + esc(s.text).replace(/x/g, '<i>x</i>') + '</div>';

    var rows = '';
    if (s.delta != null) {
      rows += '<div class="row"><span class="k">判别式</span><span class="v">Δ = b² − 4ac = ' + E.fmt(s.delta, 4) + '</span></div>';
    }
    if (s.kind === 'none') {
      rows += '<div class="row"><span class="k">实数根</span><span class="v">无</span></div>';
    } else if (s.kind === 'linear') {
      rows += '<div class="row"><span class="k">根</span><span class="v">x = ' + esc(s.roots[0].exact) + '<small>≈ ' + E.fmt(s.roots[0].approx) + '</small></span></div>';
    } else if (s.kind === 'double') {
      rows += '<div class="row"><span class="k">根（重根）</span><span class="v">x₁ = x₂ = ' + esc(s.exact[0]) + '<small>≈ ' + E.fmt(s.approx[0]) + '</small></span></div>';
    } else {
      rows += '<div class="row"><span class="k">精确根</span><span class="v">x₁ = ' + esc(s.exact[0] || '—') + '　x₂ = ' + esc(s.exact[1] || '—') + '</span></div>';
      rows += '<div class="row"><span class="k">近似值</span><span class="v">' + E.fmt(s.approx[0]) + '　/　' + E.fmt(s.approx[1]) + '</span></div>';
    }
    html += '<div class="rows">' + rows + '</div>';

    var verdict, note;
    if (s.kind === 'none') {
      verdict = '<div class="verdict neutral"><span class="mark">🔎</span><div>Δ &lt; 0，方程没有实数根，因此也不会有黄金比这样的正根。</div></div>';
      note = '请检查一次项、常数项的符号是否写反 —— 黄金分割的两个标准方程 <code>x² − x − 1 = 0</code>、<code>x² + x − 1 = 0</code> 的判别式都是 5。';
    } else if (s.kind === 'linear') {
      verdict = '<div class="verdict neutral"><span class="mark">🔎</span><div>这是一元一次方程，只有一个解，不涉及黄金比的两个根。</div></div>';
      note = '黄金分割的两种标准形式都是二次方程：<code>x² − x − 1 = 0</code>（正根 φ）与 <code>x² + x − 1 = 0</code>（正根 1/φ）。';
    } else if (g.kind === 'phi') {
      verdict = '<div class="verdict high"><span class="mark">📐</span><div>正根 <b>' + E.fmt(s.approx[0]) + '</b> 就是黄金比 <b>φ = (1+√5)/2</b>。</div></div>';
      note = '负根 ' + E.fmt(s.approx[1], 4) + ' 是 −1/φ，作为线段长度要舍去。φ ≈ 1.6180339887，它的倒数 1/φ ≈ 0.6180339887 就是黄金分割比。';
    } else if (g.kind === 'invphi') {
      verdict = '<div class="verdict high"><span class="mark">📐</span><div>正根 <b>' + E.fmt(s.approx[0]) + '</b> 就是黄金分割比 <b>1/φ = (√5−1)/2</b>。</div></div>';
      note = '由 r² + r = 1 得 r(1+r) = 1，所以 1/r = 1+r ≈ 1.6180，正是 φ。这个方程和 x² − x − 1 = 0 只差一次项符号。';
    } else if (g.kind === 'phi_scaled' || g.kind === 'invphi_scaled') {
      var k = g.k;
      if (g.kind === 'phi_scaled') {
        verdict = '<div class="verdict high"><span class="mark">📐</span><div>这是全段长 <b>' + E.fmt(k) + '</b> 时的黄金比方程，正根 = <b>' + E.fmt(k) + ' × φ ≈ ' + E.fmt(k * E.PHI) + '</b>。</div></div>';
        note = '对应定义：设线段 AB = ' + E.fmt(k) + '，AP = x，则 x² = ' + E.fmt(k) + '(' + E.fmt(k) + ' − x)，即 x² + ' + E.fmt(k) + 'x − ' + E.fmt(k * k) + ' = 0；除以 x 后得到的就是上面的方程。';
      } else {
        verdict = '<div class="verdict high"><span class="mark">📐</span><div>这是全段长 <b>' + E.fmt(k) + '</b> 时的黄金分割方程，正根 = <b>' + E.fmt(k) + ' × 0.6180 ≈ ' + E.fmt(k * E.INV_PHI) + '</b>。</div></div>';
        note = '它与你手上的 x² − x − 1 = 0 是同一段几何关系的两种写法：一个是比值（φ），一个是长度（1/φ）。';
      }
    } else {
      var nearRoot = null;
      for (var i = 0; i < s.approx.length; i++) {
        if (Math.abs(s.approx[i] - E.PHI) < 5e-4) nearRoot = { v: s.approx[i], to: 'φ' };
        if (Math.abs(s.approx[i] - E.INV_PHI) < 5e-4) nearRoot = { v: s.approx[i], to: '1/φ' };
      }
      if (nearRoot) {
        verdict = '<div class="verdict near"><span class="mark">🔎</span><div>方程不是黄金分割的标准形式，但根 ' + E.fmt(nearRoot.v) + ' 与 <b>' + nearRoot.to + '</b> 很接近，值得核对系数。</div></div>';
      } else {
        verdict = '<div class="verdict neutral"><span class="mark">🔎</span><div>这不是黄金分割的标准方程，上面是它自己的解。</div></div>';
      }
      note = '若你在验证黄金分割，注意两种标准形式：<code>x² − x − 1 = 0</code> 的正根是 φ ≈ 1.6180；<code>x² + x − 1 = 0</code> 的正根是 1/φ ≈ 0.6180。';
    }

    if (s.note) note = s.note + ' ' + (note || '');
    html += verdict + (note ? '<p class="note">' + note + '</p>' : '');
    var pillText = { two: '二次方程 · 两实根', double: '二次方程 · 重根', linear: '一次方程', none: '无实根' }[s.kind] || '二次方程';
    return agentShell(html, '方 程 求 解', pillText);
  }

  /* ---------- 线段可视化 ---------- */

  function barSVG(c) {
    var W = 620, x0 = 48, x1 = 588, y = 54, L = x1 - x0;
    var splitX = x0 + L * c.ap_over_ab;
    var goldX = x0 + L * E.INV_PHI;
    var labelY = 26, subY = 86;

    return '<div class="bar-wrap"><svg viewBox="0 0 ' + W + ' 110" role="img" aria-label="线段比例示意图">' +
      '<defs><linearGradient id="g1" x1="0" x2="1"><stop offset="0" stop-color="#2c6b8f"/><stop offset="1" stop-color="#1c3947"/></linearGradient>' +
      '<linearGradient id="g2" x1="0" x2="1"><stop offset="0" stop-color="#dce9f1"/><stop offset="1" stop-color="#c8dae5"/></linearGradient></defs>' +
      // 全段底
      '<rect x="' + x0 + '" y="' + (y - 6) + '" width="' + L + '" height="12" rx="6" fill="url(#g2)"/>' +
      // AP 较长段
      '<rect x="' + x0 + '" y="' + (y - 6) + '" width="' + (splitX - x0).toFixed(1) + '" height="12" rx="6" fill="url(#g1)"/>' +
      // 黄金分割点虚线
      '<line x1="' + goldX.toFixed(1) + '" y1="' + (y - 26) + '" x2="' + goldX.toFixed(1) + '" y2="' + (y + 30) + '" stroke="#3f7c9c" stroke-width="1.4" stroke-dasharray="5 4"/>' +
      '<text x="' + goldX.toFixed(1) + '" y="' + (y - 32) + '" text-anchor="middle" font-size="11" fill="#2c6b8f" font-family="Cambria Math,Georgia,serif">61.8%</text>' +
      // 实际分点
      '<line x1="' + splitX.toFixed(1) + '" y1="' + (y - 16) + '" x2="' + splitX.toFixed(1) + '" y2="' + (y + 18) + '" stroke="#14262f" stroke-width="2.4"/>' +
      // 端点
      '<text x="' + (x0 - 14) + '" y="' + (y + 5) + '" font-size="13" fill="#45606f" font-family="Cambria Math,Georgia,serif" font-style="italic">A</text>' +
      '<text x="' + (x1 + 8) + '" y="' + (y + 5) + '" font-size="13" fill="#45606f" font-family="Cambria Math,Georgia,serif" font-style="italic">B</text>' +
      // 段长
      '<text x="' + ((x0 + splitX) / 2).toFixed(1) + '" y="' + (y + 30) + '" text-anchor="middle" font-size="11.5" fill="#2c6b8f" font-family="Cambria Math,Georgia,serif">AP ' + E.fmt(c.longSeg) + '</text>' +
      '<text x="' + ((splitX + x1) / 2).toFixed(1) + '" y="' + (y + 30) + '" text-anchor="middle" font-size="11.5" fill="#7d94a2" font-family="Cambria Math,Georgia,serif">PB ' + E.fmt(c.shortSeg) + '</text>' +
      '</svg></div>';
  }

  function segmentCard(raw) {
    var seg = E.parseSegments(raw);
    if (seg.error) {
      return agentShell('<p class="note" style="font-size:13px">' + esc(seg.error) + '</p>', '需 要 更 多 信 息', '输入');
    }
    var c = E.checkGoldenRatio(seg.AP, seg.AB);
    if (c.error) {
      return agentShell('<div class="verdict bad"><span class="mark">⚠️</span><div>' + esc(c.error) + '</div></div>', '数 据 有 疑 问', '提示');
    }

    var rows = '';
    rows += '<div class="row"><span class="k">AP / AB</span><span class="v">' + E.fmt(c.longSeg) + ' / ' + E.fmt(c.totalSeg) + ' = ' + E.fmt(c.ap_over_ab) +
      '<small>黄金分割比 0.6180</small></span></div>';
    rows += '<div class="row"><span class="k">AB / AP</span><span class="v">' + E.fmt(c.totalSeg) + ' / ' + E.fmt(c.longSeg) + ' = ' + E.fmt(c.ab_over_ap) +
      '<small>黄金比 φ = 1.6180</small></span></div>';
    if (c.ap_over_pb != null) {
      rows += '<div class="row"><span class="k">AP / PB</span><span class="v">' + E.fmt(c.longSeg) + ' / ' + E.fmt(c.shortSeg) + ' = ' + E.fmt(c.ap_over_pb) +
        '<small>黄金比 φ = 1.6180</small></span></div>';
    }
    rows += '<div class="row"><span class="k">偏差</span><span class="v">|' + E.fmt(c.ap_over_ab) + ' − 0.6180| = ' + E.fmt(c.dev_0618) + '</span></div>';

    var mark = { high: '✅', ok: '✅', near: '⚠️', bad: '⚠️' }[c.level];
    var html = barSVG(c) + '<div class="rows">' + rows + '</div>';
    html += '<div class="verdict ' + c.level + '"><span class="mark">' + mark + '</span><div>AP/AB ≈ <b>' + E.fmt(c.ap_over_ab) +
      '</b>，偏差 <b>' + E.fmt(c.dev_0618) + '</b>，<b>' + esc(c.verdict) + '</b>。</div></div>';

    if (c.level === 'high' || c.level === 'ok') {
      var pct = c.dev_0618 * 100;
      html += '<p class="note">较长段占全段的 ' + E.fmt(c.ratio_percent, 2) + '%，与黄金分割点 61.803% ' +
        (pct < 0.005 ? '基本重合。' : '相差 ' + E.fmt(pct, 2) + ' 个百分点，可以认为满足黄金分割。') + '</p>';
    }
    if (c.suggestions && c.suggestions.length) {
      html += '<ul class="tips">' + c.suggestions.map(function (t) { return '<li>' + esc(t) + '</li>'; }).join('') + '</ul>';
    }
    if (seg.assumption) html += '<p class="assume">' + esc(seg.assumption) + '</p>';

    return agentShell(html, '比 值 验 证', c.level === 'bad' ? '需 复 查' : '已 比 对');
  }

  /* ---------- 概念问答 ---------- */

  function chipHTML(list) {
    return '<div class="chips">' + list.map(function (q) {
      return '<button class="chip" data-q="' + esc(q) + '">' + esc(q) + '</button>';
    }).join('') + '</div>';
  }

  function faqCard(f) {
    var html = '<div class="eq-title" style="font-size:19px;text-align:left;padding:2px 0 8px;letter-spacing:0">' +
      esc(f.entry.q) + '</div>' +
      '<p class="note" style="margin-top:0;font-size:13.5px;line-height:1.8;color:#3d5460">' + f.entry.a + '</p>';

    // 顺手给两个相邻话题，方便继续问
    var rel = [];
    for (var i = 1; i <= 2; i++) {
      var j = (f.index + i * 4) % E.FAQ.length;
      if (j !== f.index && rel.indexOf(E.FAQ[j].q) < 0) rel.push(E.FAQ[j].q);
    }
    html += chipHTML(rel);
    return agentShell(html, '概 念 解 答', '知识点');
  }

  /* ---------- 帮助 ---------- */

  function helpCard(extra) {
    var html = '<p class="note" style="font-size:15px;margin-top:0">' + (extra || '我负责两件事：验算方程，验证线段比值。') + '</p>' +
      '<div class="rows">' +
      '<div class="row"><span class="k">解方程</span><span class="v">x² − x − 1 = 0<small>也认 x^2 - x - 1 = 0</small></span></div>' +
      '<div class="row"><span class="k">验比值</span><span class="v">AP=6.18，AB=10<small>较长段 / 全段</small></span></div>' +
      '<div class="row"><span class="k">三段也行</span><span class="v">AP=5，PB=3，AB=8</span></div>' +
      '</div>' +
      chipHTML(['什么是黄金分割？', '0.618 和 1.618 是什么关系？', '徽章设计里怎么用黄金分割？']);
    return agentShell(html, '怎 么 用', '格式');
  }

  /* ---------- 路由 ---------- */

  function answer(raw) {
    var s = E.normalize(raw);
    if (!s) return helpCard('先写点内容吧，比如 <b>x² - x - 1 = 0</b>、<b>AP=6.18，AB=10</b>，或者直接问概念。');
    if (/^(帮助|help|\?|？|怎么用|使用说明)$/i.test(s)) return helpCard();

    if (E.looksLikeEquation(s)) {                              // ① 方程
      if (E.parseEquation(raw).ok) return equationCard(raw);
      var fe = E.faqMatch(s);                                  // 像「为什么会出现 x²-x-1=0」这种问句
      if (fe) return faqCard(fe);
      return equationCard(raw);
    }
    if (E.hasLabels(s)) return segmentCard(raw);               // ② 带 AP/AB/PB 的比值

    var f = E.faqMatch(s);
    if (f) return faqCard(f);                                  // ③ 概念问答

    if (/x/i.test(raw) && s.indexOf('=') < 0) {
      return helpCard('看起来你想写方程，但少了等号。完整写法：<b>x² - x - 1 = 0</b>。');
    }
    if (/[0-9]/.test(s)) return segmentCard(raw);              // ④ 两个裸数字，按比值理解
    return helpCard('这句话我没接住 —— 我只会验算、以及回答这张清单里的概念问题。');
  }

  /* ---------- 事件 ---------- */

  function send(text) {
    var t = (text || '').trim();
    if (!t) { input.focus(); return; }
    push(userBubble(t));
    input.value = '';
    setTimeout(function () {
      push(answer(t));
    }, 120);
  }

  form.addEventListener('submit', function (e) {
    e.preventDefault();
    send(input.value);
  });

  document.addEventListener('click', function (e) {
    var b = e.target.closest ? e.target.closest('[data-q]') : null;
    if (!b) return;
    e.preventDefault();
    send(b.getAttribute('data-q'));
  });

  document.getElementById('clear').addEventListener('click', function () {
    log.innerHTML = '';
    welcome();
    input.focus();
  });

  function welcome() {
    var html = '<p class="note" style="font-size:15px;margin-top:0;line-height:1.7">' +
      '我是这个探究活动的<b>验算员</b>。你手算出方程根或量出线段长度后，把结果发给我，我快速比对黄金比并给出判断。' +
      '<br><span style="color:#728a98">推导仍然由你完成 —— 我只回答“这个结果对不对”。</span></p>' +
